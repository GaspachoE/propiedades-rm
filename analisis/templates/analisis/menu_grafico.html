<li class="dropend">
  <a
    class="nav-link d-flex justify-content-between align-items-center dropdown-toggle {% if request.resolver_match.url_name == url_name or request.resolver_match.kwargs.numero == numero %}active{% endif %}"
    href="#"
    role="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
  >
    {{ nombre }}
  </a>
  <ul class="dropdown-menu shadow">
    <li>
      <a class="dropdown-item" href="{% url url_name %}">📊 Ver gráfico</a>
    </li>
    <li>
      <a class="dropdown-item" href="{% url 'informe' numero %}"
        >📄 Ver informe</a
      >
    </li>
  </ul>
</li>
