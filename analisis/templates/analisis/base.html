<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block titulo %}Propiedades RM{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .sidebar {
        width: 260px;
      }
      @media (min-width: 992px) {
        .sidebar {
          position: sticky;
          top: 0;
          height: 100vh;
          flex-shrink: 0;
          z-index: 1030; /* por encima de las tarjetas y el contenido */
        }
      }
      /* En móvil no hay espacio al costado: el menú se despliega hacia abajo */
      @media (max-width: 991.98px) {
        .sidebar .dropdown-menu {
          position: static !important;
          transform: none !important;
          border: 0;
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="d-flex flex-column flex-lg-row min-vh-100">
      {% include 'analisis/menu.html' %}
      <main class="flex-grow-1 p-4">{% block contenido %}{% endblock %}</main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
