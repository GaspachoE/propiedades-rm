{% extends 'analisis/base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<div class="card shadow-sm">
  <div class="card-body text-center">
    <img
      src="data:image/png;base64,{{ grafico }}"
      class="img-fluid rounded"
      alt="{{ titulo }}"
    />
  </div>
</div>
<a class="btn btn-primary mt-3" href="{% url 'informe' numero %}">Ver informe</a>
{% endblock %}
